<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>board</title>
	<link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
	<div class="container">
		<h2>게시판 상세 화면</h2>
		<form id="frm" method="post">
			<table class="board_detail">
				<colgroup>
					<col width = "15%"/>
					<col width = "*"/>
					<col width = "15%"/>
					<col width = "20%"/>
				</colgroup>
				<caption>게시글 상세내용</caption>
				<tbody>
					<tr>
						<th scope="row">글 번호</th>
						<td th:text="${board.boardId}"></td>
						<th scope="row">조회수</th>
						<td th:text="${board.hitCnt}"></td>
					</tr>
					<tr>
						<th scope="row">작성자</th>
						<td th:text="${board.creatorId}"></td>
						<th scope="row">작성일</th>
						<td th:text="${#temporals.format(board.createdDatetime,'yyyy-MM-dd HH:mm:ss')}"></td>
					</tr>
					<tr>
						<th scope="row">제목</th>
						<td colspan="3">
							<input type="text" id="title" name="title"  th:value="${board.title}">
						</td>
					</tr>
					<tr>
						<td colspan="4">
							<textarea title="내용" id="contents" name="contents"  th:text="${board.contents}"></textarea>
						</td>
					</tr>
				</tbody>
			</table>
			<input type="hidden" name="boardId" id="boardId" th:value="${board.boardId}">
			<input type="hidden" name="_method" id="_method">
		</form>
		
		<div class="file_list">
			<a th:each="list : ${board.fileList}" 
			th:href="@{/board/file(id=${list.id},boardId=${list.boardId})}" 
			th:text="|${list.originalFileName} (${list.fileSize} kb)|"></a>
		</div>
		
		<a href="#this" id="list" class="btn">목록으로</a>
		<a href="#this" id="edit" class="btn">수정하기</a>
		<a href="#this" id="delete" class="btn">삭제하기</a>
	</div>
	
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
	
	<script type="text/javascript">
		let boardId = $("#boardId").val();
	
		$(document).ready(function() {
			$("#list").on("click", function() {
				location.href = "/board";
			});

			$("#edit").on("click", function() {
				$("#_method").val("put");
				var frm = $("#frm")[0];
				frm.action = "/board/" + boardId;
				frm.submit();
			});

			$("#delete").on("click", function() {
				$("#_method").val("delete");
				var frm = $("#frm")[0];
				frm.action = "/board/" + boardId;
				frm.submit();
			});
		});
	</script>
</body>
</html>
